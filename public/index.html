<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabAI — Real-Time Collaborative Document Editor</title>
    <meta name="description" content="Next-generation collaborative document editor powered by custom Operational Transformation, sub-50ms WebSocket synchronization, and Google Gemini AI conflict mediation.">
    
    <!-- Google Fonts: Inter, Outfit, and Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/landing.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/editor.css">
    <link rel="stylesheet" href="/css/ai-panel.css">
    <link rel="stylesheet" href="/css/modal.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a73e8'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'></path></svg>">
</head>
<body>
    <div id="app">
        <!-- Persistent Top Navigation Bar -->
        <header id="navbar-root"></header>

        <!-- Dynamic Main View Container (Landing, Dashboard, or Editor) -->
        <main id="main-root"></main>

        <!-- AI Assistant Drawer Anchor -->
        <div id="ai-root"></div>

        <!-- Semantic Conflict Mediator Anchor -->
        <div id="conflict-root"></div>

        <!-- Modals and Dialogs -->
        <div id="modal-auth-root"></div>
        <div id="modal-share-root"></div>

        <!-- Toast Notifications -->
        <div id="toast-container"></div>
    </div>

    <!-- Socket.IO Client Library (Served directly by Express backend) -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- CollabAI SPA Entrypoint -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
